name: price-alert
on:
  schedule:
    # 米国市場の取引時間中(UTC 13:30〜21:00 ≒ タイ時間 20:30〜翌4:00)、月〜金に15分ごと。
    # 夏時間・冬時間の両方をカバーするため少し広めに取っている。
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write              # 通知済みを alerts.csv に記録するため
concurrency: price-alert
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 price_alert.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: 通知済みの記録をコミット
        run: |
          git config user.name "price-alert bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alerts.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "alerts: 通知済みを記録"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push
